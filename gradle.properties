kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# The application version. One source for Android's `versionName` and the
# desktop installers' `packageVersion` (issue #29), so the two artefacts of a
# release can never claim different versions.
lekto.version=0.1.0

# Roborazzi: `captureRoboImage("name.png")` writes under the configured output
# directory (app/src/desktopTest/goldens), not the Gradle working directory, so
# the recorded goldens are committed and reviewed like any other file. Ticket #7.
roborazzi.record.filePathStrategy=relativePathFromRoborazziContextOutputDirectory
