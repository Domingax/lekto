# The lanes that gate every change (ticket #7).
#
# `fast` and `licences` run on every pull request and on a push to `main`; the
# `sonar` lane reuses the reports `fast` produced instead of building a second
# time. `push` is filtered to `main` on purpose: a branch push also opens a pull
# request for the same commit, so an unfiltered `push` would run every lane twice
# — and would also fire on a release tag, which `release.yml` already covers. The
# nightly emulator lane lives in nightly.yml and never touches the critical path.
# See docs/build.md#ci-lanes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# `CI_RUNNER` is an optional repository variable. Set it to `self-hosted` to
# send these lanes to a local runner; unset, they use GitHub's hosted image.
jobs:
  # The fast lane. Builds every module, runs every JVM suite — the domain and
  # UI-semantics suites, the Android host lanes and the WebDAV driver's container
  # cases — verifies the committed UI goldens, enforces ktlint and detekt, and
  # writes the coverage report the `sonar` lane scans. Doing all of it in one
  # invocation is what keeps the build and the tests to a single run per change.
  # This is the job branch protection requires before a pull request can merge.
  #
  # The WebDAV container cases need Docker, present on GitHub's runners; where it
  # is absent they skip instead of failing, so the lane still passes.
  fast:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # `-Proborazzi.test.verify=true` compares the goldens inside the
      # `desktopTest` run `check` already triggers. The `verifyRoborazziDesktop`
      # task would run that whole suite a second time, so the property is what
      # keeps the goldens in the same pass. `koverXmlReport` rides along for the
      # same reason: the tests are already running, and the `sonar` lane then
      # downloads the report rather than re-running them.
      - name: Build, test, verify the goldens and measure coverage
        run: ./gradlew check koverXmlReport -Proborazzi.test.verify=true --no-daemon
      # The release variant is the one that ships, and nothing else compiles it: a
      # resource, packaging or R8 failure would otherwise surface on the tag,
      # minutes before a release (issue #262). No signing secret is present here,
      # and none is needed — the build stays unsigned, as it does on a fork.
      - name: Build the unsigned release APK
        run: ./gradlew :app:assembleRelease -Plekto.android=true --no-daemon
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jvm-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            app/build/outputs/roborazzi/**
          if-no-files-found: ignore
      # The exact files `sonar-project.properties` names: the merged coverage XML
      # and the two merged Checkstyle reports. Uploaded from `build/reports` so
      # the download restores those paths unchanged.
      - name: Upload the SonarCloud reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sonar-reports
          path: build/reports
          if-no-files-found: warn

  # Every dependency, test-scope included, must be AGPL-compatible (ADR-0011).
  # The task resolves dependency metadata at execution time, which the
  # configuration cache cannot store, so it runs without the cache.
  licences:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Check dependency licences
        run: ./gradlew checkDependencyLicences --no-configuration-cache --no-daemon
      - name: Upload the licence report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-licences
          path: build/reports/dependency-licences.txt
          if-no-files-found: ignore

  # Coverage and the SonarCloud quality gate (ticket #8, ADR-0012). It scans what
  # `fast` produced instead of building and testing a second time: the checkout
  # gives the scanner its sources and history, the downloaded report gives it the
  # coverage XML and the ktlint and detekt findings. The scan waits for the quality
  # gate on the change's new code (`sonar.qualitygate.wait` in
  # sonar-project.properties), so this job blocks the merge once branch protection
  # requires it. A fork carries no secret, so its scan is skipped.
  sonar:
    # The gate is for the change under review, so analyse pull requests and the
    # main branch that is their baseline — not every feature-branch push.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: fast
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud reads the history to tell new code from the baseline.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Download the coverage and linter reports
        uses: actions/download-artifact@v8
        with:
          name: sonar-reports
          path: build/reports
      - name: Analyse with SonarCloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8
