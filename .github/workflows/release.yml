# The desktop release lane (issue #29).
#
# jpackage can only build the installer of the operating system it runs on, so
# one runner per platform produces its own artefact and the release job collects
# them. A tag is what publishes; `workflow_dispatch` builds the installers
# without publishing, so a packaging change can be exercised without cutting a
# release. See docs/build.md#desktop.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # One installer per operating system. The two macOS runners cover Apple
  # Silicon and Intel: a jpackage image is architecture-specific, and an
  # arm64-only download would leave Intel Macs without a build.
  package:
    name: package (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
            extension: deb
            # A Debian package's file name is lower-case by convention; the other
            # platforms keep the product's capitalisation.
            prefix: lekto
          - label: windows-x64
            runner: windows-latest
            extension: msi
            prefix: Lekto
          - label: macos-arm64
            runner: macos-15
            extension: dmg
            prefix: Lekto
          - label: macos-x64
            runner: macos-15-intel
            extension: dmg
            prefix: Lekto
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # jpackage shells out to dpkg-deb for a Debian package, and the toolchain
      # is a documented prerequisite. The Ubuntu runner carries both already;
      # installing them explicitly keeps the lane independent of the image's
      # contents.
      - name: Install the Debian packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dpkg fakeroot
      # The installer is the desktop client only, so the Android target stays
      # off: no Android SDK is needed and the lane is the same on every runner.
      - name: Build the installer
        shell: bash
        run: ./gradlew :app:packageDistributionForCurrentOS -Plekto.android=false --no-daemon
      # jpackage writes its own diagnosis to per-task log files and Gradle only
      # names them. Without this step a macOS-only failure shows an exit code and
      # nothing else, which is how the first tagged preview failed.
      - name: Show the packaging log on failure
        if: failure()
        shell: bash
        run: |
          for log in app/build/compose/logs/*/*.txt; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
      # jpackage names each artefact after the platform's own convention (the
      # Debian file even repeats the architecture), and both macOS runners produce
      # the same `Lekto-<version>.dmg`. One scheme makes each file distinct and
      # matches what the guide tells the reader to download.
      - name: Name the installer for its platform
        shell: bash
        run: |
          version="$(sed -n 's/^lekto\.version=//p' gradle.properties)"
          mkdir -p dist
          for artifact in app/build/compose/binaries/main/*/*.${{ matrix.extension }}; do
            cp "$artifact" "dist/${{ matrix.prefix }}-${version}-${{ matrix.label }}.${{ matrix.extension }}"
          done
      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.label }}
          path: dist/*.${{ matrix.extension }}
          if-no-files-found: error

  # Publish every installer on the tag's release, with the committed desktop
  # notes. A manual run builds them and stops there, and a tag with a pre-release
  # suffix (`v1.0.0-preview`) publishes a pre-release, so a preview never becomes
  # the `/releases/latest` download the guide points at.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `gh release create` shells out to git; a job without a checkout has no
      # repository to run that in, even though the release itself is remote.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # The body is committed and reviewed like code, so every desktop release
      # states the platform's accessibility limit where a downloader meets it.
      - name: Write the release notes
        shell: bash
        run: |
          version="$(sed -n 's/^lekto\.version=//p' gradle.properties)"
          sed \
            -e "s|{{REPOSITORY}}|$GITHUB_REPOSITORY|g" \
            -e "s|{{VERSION}}|$version|g" \
            .github/release-notes/desktop.md > "$RUNNER_TEMP/RELEASE_NOTES.md"
          cat "$RUNNER_TEMP/RELEASE_NOTES.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "Lekto $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md" --verify-tag)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${args[@]}"
