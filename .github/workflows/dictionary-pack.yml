# The dictionary-data lane (tickets #17, #161).
#
# It reads the committed `tools/dictionaries/languages.json`, builds every
# dictionary pack and difficulty table it lists from the raw Wiktextract extract,
# and publishes them together in one GitHub Release. It runs on demand and
# monthly, and never on a push or pull request, so it cannot block application CI
# (docs/build.md#dictionary-pipeline). The assets are release artifacts and are
# never committed. See ADR-0017 for the access shape, ADR-0031 for the
# config-driven, single-release decision, and docs/research/open-dictionaries.md
# for the source rationale.
name: dictionary-pack

on:
  workflow_dispatch:
  schedule:
    # Monthly, on the 1st at 03:17 UTC. Kaikki overwrites its raw file weekly and
    # keeps no dated archive, so each run sees newer data; the build's sanity gate
    # fails only on a changed schema or a coverage collapse, not on ordinary drift.
    - cron: "17 3 1 * *"

concurrency:
  group: dictionary-pack
  cancel-in-progress: false

# Creating the release needs write access to repository contents.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Streaming the ~3 GiB gz source once per configured dictionary pair dominates.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve the release date
        id: release
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Download the raw Wiktextract source
        id: download
        run: |
          curl -fL --retry 3 --retry-delay 5 \
            -D "$RUNNER_TEMP/source-headers.txt" \
            -o "$RUNNER_TEMP/raw-wiktextract-data.jsonl.gz" \
            https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz
          # The upstream extraction date is the source file's own Last-Modified,
          # not the day this workflow runs: the same input must record the same
          # provenance.
          last_modified="$(grep -i '^last-modified:' "$RUNNER_TEMP/source-headers.txt" | tail -1 \
            | cut -d' ' -f2- | tr -d '\r')"
          if [ -n "$last_modified" ]; then
            echo "extraction_date=$(date -u -d "$last_modified" +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          else
            echo "extraction_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Hash the source
        id: source
        run: |
          echo "sha256=$(sha256sum "$RUNNER_TEMP/raw-wiktextract-data.jsonl.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The sanity gate compares each reading language's lemma count with the
      # previous release's. A first run has no previous release, and a language
      # newly added to the set has no previous manifest, so neither is gated on
      # coverage.
      - name: Look up the previous packs' lemma counts
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/previous"
          tag="$(gh release list --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("dictionary-"))][0].tagName')"
          if [ -n "$tag" ] && [ "$tag" != "null" ]; then
            gh release download "$tag" --pattern 'manifest-lekto-dictionary-*.json' \
              --dir "$RUNNER_TEMP/previous" --clobber || true
          fi
          # One gate per reading language, from its first configured pair.
          counts=""
          for reading in $(jq -r '.dictionaries[].reading' tools/dictionaries/languages.json | awk '!seen[$0]++'); do
            pair="$(jq -r --arg reading "$reading" \
              '.dictionaries[] | select(.reading == $reading) | .reading + "-" + .translation' \
              tools/dictionaries/languages.json | head -1)"
            manifest="$RUNNER_TEMP/previous/manifest-lekto-dictionary-$pair.json"
            if [ -f "$manifest" ]; then
              counts="$counts --previous-lemma-count $reading=$(jq -r '.stats.lemmaCount' "$manifest")"
            fi
          done
          echo "args=$counts" >> "$GITHUB_OUTPUT"

      - name: Build the CLI
        run: ./gradlew --no-daemon :tools:dictionaries:installDist

      # The difficulty build reads wordfreq's per-surface frequencies, which the
      # pipeline aggregates onto the reading language's lemmas (ADR-0029).
      # `10 ** zipf` is the per-billion occurrence count the Zipf score is the
      # logarithm of. One list per configured difficulty language. The Python
      # heredoc body sits at the block's base indentation, so YAML strips every
      # leading space and the code is unindented.
      - name: Build the wordfreq frequency lists
        run: |
          python3 -m pip install --quiet "wordfreq==3.0.2"
          python3 - <<'PY'
          import json
          import os
          from wordfreq import iter_wordlist, zipf_frequency
          difficulties = json.load(open("tools/dictionaries/languages.json"))["difficulties"]
          for language in difficulties:
              path = f"{os.environ['RUNNER_TEMP']}/wordfreq-{language}.tsv"
              with open(path, "w", encoding="utf-8") as handle:
                  for word in iter_wordlist(language):
                      handle.write(f"{word}\t{10 ** zipf_frequency(word, language)}\n")
          PY
          for lang in $(jq -r '.difficulties[]' tools/dictionaries/languages.json); do
            gzip -9 -n "$RUNNER_TEMP/wordfreq-$lang.tsv"
          done

      - name: Build every configured pack and difficulty table
        env:
          PREVIOUS_ARGS: ${{ steps.previous.outputs.args }}
        run: |
          cli=tools/dictionaries/build/install/dictionaries/bin/dictionaries
          out="$RUNNER_TEMP/out"
          args=(
            --input "$RUNNER_TEMP/raw-wiktextract-data.jsonl.gz"
            --languages-config tools/dictionaries/languages.json
            --output-dir "$out"
            --source-url "https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz"
            --source-sha256 "${{ steps.source.outputs.sha256 }}"
            --extraction-date "${{ steps.download.outputs.extraction_date }}"
            --language-manifest "$out/language-manifest.json"
          )
          for lang in $(jq -r '.difficulties[]' tools/dictionaries/languages.json); do
            args+=(--frequency "$lang=$RUNNER_TEMP/wordfreq-$lang.tsv.gz")
          done
          # Word-split the "<language>=<count>" pairs the lookup step produced.
          # shellcheck disable=SC2206
          args+=($PREVIOUS_ARGS)
          "$cli" "${args[@]}"

      # `-n` omits the gzip timestamp and filename, so compression adds no
      # non-determinism of its own. The pack and table names are already date-free,
      # so the app fetches them from stable
      # `releases/latest/download/<name>` URLs (issues #18, #161).
      - name: Compress the assets deterministically
        run: |
          for sqlite in "$RUNNER_TEMP/out"/*.sqlite; do
            gzip -9 -n "$sqlite"
          done

      - name: Write the checksums
        run: |
          cd "$RUNNER_TEMP/out"
          sha256sum *.sqlite.gz language-manifest.json > SHA256SUMS

      # A short, generated release body (provenance + the catalogue pointer + the
      # licence), not the full NOTICE: the legal text stays in the NOTICE assets and
      # inside each pack's and table's metadata. The template is committed so the
      # wording is reviewed like code.
      - name: Write the release notes
        run: |
          manifest="$RUNNER_TEMP/out/manifest-lekto-dictionary-en-fr.json"
          sed \
            -e "s|{{REPOSITORY}}|${{ github.repository }}|g" \
            -e "s|{{SOURCE_URL}}|$(jq -r '.provenance.sourceUrl' "$manifest")|g" \
            -e "s|{{SOURCE_SHA256}}|$(jq -r '.provenance.sourceSha256' "$manifest")|g" \
            -e "s|{{EXTRACTION_DATE}}|$(jq -r '.provenance.extractionDate' "$manifest")|g" \
            .github/release-notes/dictionary-pack.md > "$RUNNER_TEMP/RELEASE_NOTES.md"
          cat "$RUNNER_TEMP/RELEASE_NOTES.md"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/out"
          tag="dictionary-${{ steps.release.outputs.date }}"
          notes="$RUNNER_TEMP/RELEASE_NOTES.md"
          assets=(
            "$out"/*.sqlite.gz
            "$out"/language-manifest.json
            "$out"/SHA256SUMS
            "$out"/NOTICE-*
            "$out"/manifest-*.json
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file "$notes"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --title "Dictionary data ${{ steps.release.outputs.date }}" \
              --notes-file "$notes"
          fi
