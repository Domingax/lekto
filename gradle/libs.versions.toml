[versions]
# Toolchain. These are pinned deliberately: every agent and every machine must
# build against exactly these versions. See docs/build.md before changing them.
agp = "8.13.2"
kotlin = "2.4.20"
gradle = "8.14.4"
jdk = "21"
compose-multiplatform = "1.11.1"
compose-material3 = "1.11.0-alpha07"

# Android platform levels. The pinned SDK in CI provides platform 36.
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"

# Libraries.
androidx-activity = "1.12.4"

# Test harness (ticket #5). Every entry is test-scope and AGPL-compatible
# (Apache-2.0); see docs/testing.md and docs/research/testing-harness.md.
kotest = "6.2.5"
turbine = "1.2.1"
kotlinx-coroutines = "1.11.0"

# Android host tests (ticket #49). Robolectric (MIT) runs Android platform code on
# a simulated Android runtime on the JVM, with no emulator. It is test-scope only
# and never ships; 4.16.1 is the release whose built-with Gradle/AGP line matches
# this repository's, and it covers API 36. See docs/testing.md#android-host-lane.
robolectric = "4.16.1"
# Robolectric's runner is JUnit 4; declared explicitly so the host test compiles
# against it rather than borrowing a transitive. JUnit 4 is EPL-1.0, test-only
# (ADR-0011; config/dependency-licences.txt).
junit4 = "4.13.2"

# Android UI tests for the app (issue #71). The JUnit 4 Compose rule runs the
# Compose UI under Robolectric on the host (fast lane, `androidUnitTest`) and on
# an emulator (nightly lane, `androidInstrumentedTest`). Compose Multiplatform
# maps to androidx.compose.ui 1.11.2 on Android, so the Android-only test
# artifacts follow that version: `ui-test-manifest` supplies the host Activity
# `createComposeRule()` starts, and AndroidX Test drives the instrumented runner.
androidx-compose-ui-test = "1.11.2"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"

# CI lanes (ticket #7). Roborazzi records the UI goldens (Apache-2.0); the JUnit
# 5 API drives the WebDAV integration test, and Testcontainers (MIT) starts the
# server. JUnit is EPL-2.0 and therefore test-only — it is never linked into the
# shipped app (ADR-0011); see config/dependency-licences.txt.
junit-jupiter = "5.13.4"
roborazzi = "1.75.0"
testcontainers = "2.0.5"

# Quality gates (ticket #6). ktlint formats and lints (MIT); detekt is the
# static analyser (Apache-2.0). Both are AGPL-compatible (ADR-0011). detekt is
# on the 2.0 line because that is the one built against Kotlin 2.4; see
# docs/build.md.
ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
detekt = "2.0.0-alpha.6"

# Reader spike (ticket #10). ICU4J segments text into words with dictionary-based
# CJK support, the desktop twin of `android.icu.text.BreakIterator` (ADR-0007);
# jsoup parses XHTML leniently, because real EPUBs carry HTML entities and
# unclosed tags a strict XML parser rejects. ICU4J is Unicode-3.0, jsoup MIT;
# both are AGPL-compatible (ADR-0011). See docs/research/epub-to-tokens-spike.md.
icu4j = "78.3"
jsoup = "1.23.2"

# Vault (ticket #12). Records are one JSON file each (ADR-0003), so the domain
# serialises with kotlinx.serialization (Apache-2.0, AGPL-compatible). The
# Kotlin compiler plugin is versioned with Kotlin itself.
kotlinx-serialization = "1.9.0"

# Secret storage (issue #24). KSafe (Apache-2.0) backs the desktop `SecretStore`
# through the OS keychain — Windows DPAPI, macOS Keychain, Linux Secret Service
# (ADR-0021). Desktop-only: Android backs the seam with its own Keystore code, so
# KSafe never reaches the Android classpath. Its transitive dependencies
# (kotlinx.serialization, kotlinx-coroutines, androidx.datastore, okio) are all
# permissive; the licence gate is the authority. See docs/testing.md.
ksafe = "3.3.0"

# Measurement (ticket #8). Kover (Apache-2.0) is JetBrains' Kotlin coverage
# engine and the KMP-native alternative to JaCoCo; it writes a
# JaCoCo-compatible XML report. SonarCloud is a hosted service, not a build
# dependency, so it does not appear here. See ADR-0012 and
# docs/build.md#coverage-and-the-quality-gate.
kover = "0.9.9"

# Dictionary-pack pipeline (ticket #17). xerial sqlite-jdbc (Apache-2.0,
# AGPL-compatible) builds the read-only SQLite pack ADR-0017 opens by path. It is
# used by the standalone `tools/dictionaries` CLI *and*, since issue #18, by
# `core`'s JVM target as the desktop pack reader, so it is on a production
# classpath and held to the licence gate like any other dependency. The Android
# client reads the pack with the framework's SQLite instead (ADR-0018).
sqlite-jdbc = "3.53.4.0"

# WebDAV on Android (issue #116). Android ships no `java.net.http` and
# `HttpURLConnection` rejects the `PROPFIND`/`MKCOL` methods WebDAV needs, so the
# Android transport is OkHttp, which performs any HTTP method (ADR-0026). It is
# Apache-2.0 and therefore AGPL-compatible (ADR-0011); the desktop target keeps
# the dependency-free JDK client and never carries OkHttp.
okhttp = "5.4.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }

compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-ui-test-junit4 = { module = "org.jetbrains.compose.ui:ui-test-junit4", version.ref = "compose-multiplatform" }
# Android-only: the host Activity `createComposeRule()` starts under Robolectric
# and on a device (issue #71). JetBrains publishes no multiplatform twin.
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "compose-material3" }

kotest-framework-engine = { module = "io.kotest:kotest-framework-engine", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
# The streaming **LLM provider** seam returns a `Flow` of text deltas (issue #89;
# ADR-0022), so `core`'s shared sources expose `kotlinx.coroutines` to every
# consumer. Apache-2.0, so AGPL-compatible like the rest (ADR-0011).
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
# Android host tests (ticket #49): see the versions block above.
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# Roborazzi's KMP artifacts. The desktop target uses the JVM `-core` and
# `-compose-desktop` modules; the plain `roborazzi`/`roborazzi-compose` are the
# Android (AAR) ones.
roborazzi-core = { module = "io.github.takahirom.roborazzi:roborazzi-core", version.ref = "roborazzi" }
roborazzi-compose-desktop = { module = "io.github.takahirom.roborazzi:roborazzi-compose-desktop", version.ref = "roborazzi" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }

# Reader spike (ticket #10): see the versions block above.
icu4j = { module = "com.ibm.icu:icu4j", version.ref = "icu4j" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }

# Vault (ticket #12): see the versions block above.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Dictionary-pack pipeline (ticket #17): see the versions block above.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

# WebDAV on Android (issue #116): see the versions block above. The Android
# target resolves OkHttp's `androidJvm` (AAR) variant; the desktop target never
# carries it.
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

# Secret storage (issue #24): see the versions block above. The plain KMP
# coordinate resolves to the `-jvm` variant on the desktop target.
ksafe = { module = "eu.anifantakis:ksafe", version.ref = "ksafe" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
# The Android library target for a Kotlin Multiplatform module (AGP's KMP
# support). Unlike `com.android.application`, it provides the `androidHostTest`
# source set Robolectric runs in (ticket #49).
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
