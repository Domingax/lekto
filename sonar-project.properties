sonar.projectKey=Domingax_lekto
sonar.organization=domingax
sonar.host.url=https://sonarcloud.io

sonar.projectName=Lekto
sonar.sourceEncoding=UTF-8

sonar.sources=core/src/commonMain/kotlin,core/src/jvmSharedMain/kotlin,app/src/commonMain/kotlin,app/src/desktopMain/kotlin,app/src/androidMain/kotlin,integrations/webdav/src/jvmMain/kotlin

sonar.tests=core/src/commonTest/kotlin,core/src/jvmTest/kotlin,core/src/androidHostTest/kotlin,app/src/desktopTest/kotlin,integrations/webdav/src/jvmTest/kotlin

sonar.exclusions=**/build/**,**/*.gradle.kts

sonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml

# Coverage excludes the composition roots and entry points that cannot run on the
# JVM test lane: the Android platform glue (Robolectric host tests arrive with the
# platform work) and the desktop process entry point and its modal Swing file
# picker. The testable desktop wiring beside them (DesktopLibrary.kt) is not
# excluded and is covered by DesktopLibraryTest.
sonar.coverage.exclusions=app/src/androidMain/**,app/src/desktopMain/kotlin/app/lekto/Main.kt,app/src/desktopMain/kotlin/app/lekto/DesktopFilePicker.kt,**/*.gradle.kts

# The OPF and Dublin Core XML namespaces are identifiers, not network endpoints:
# the parser never dereferences them, and external entity/DTD loading is disabled
# (OpfDocument.parseXml). Sonar's S5332 ("use HTTPS") is a false positive on
# these `http://` URIs, which are the fixed strings the EPUB standard defines.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=kotlin:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=core/src/jvmSharedMain/kotlin/app/lekto/core/epub/OpfDocument.kt

# SonarCloud's Kotlin importer takes concrete report files and does not expand
# wildcards (an entry is turned into a File verbatim). detekt and ktlint each write
# one report per source set or Kotlin compilation, so the build merges them, per
# tool, into the two files below (`mergeDetektReports` / `mergeKtlintReports` in
# build.gradle.kts). `verifySonarReportPaths` asserts these paths stay readable.
sonar.kotlin.detekt.reportPaths=build/reports/sonar/detekt.xml

sonar.kotlin.ktlint.reportPaths=build/reports/sonar/ktlint.xml

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
